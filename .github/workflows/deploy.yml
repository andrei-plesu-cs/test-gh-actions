name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/*"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
      - name: Install dependencies
        run: npm ci
      - name: Run the test
        run: npm test
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
  deploy:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
      - name: Install dependencies
        run: npm ci
      - name: Build code
        run: npm run build
      - name: Finish job
        run: echo "Finished the job!"
