name: Deploy

on:
  push:
    branches:
      - main
env:
  TEST_ENV_VAR: willthiswork
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
      - name: Install dependencies
        run: npm ci
      - name: Run the test
        run: npm test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release
        uses: actions/download-artifact@v7
        with:
          name: dist-files
      - name: Check files
        run: ls
      - name: Echo env var
        run: echo "Env var is $TEST_ENV_VAR"
