name: Deploy

on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
      - name: Install dependencies
        run: npm ci
      - name: Run the test
        run: npm test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release
        uses: actions/download-artifact@v7
        with:
          name: dist-files
      - name: Check files
        run: ls
