name: Test

on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
      - name: Install dependencies
        run: npm ci
      - name: Run the test
        run: npm test
